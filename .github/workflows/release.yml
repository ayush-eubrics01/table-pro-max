name: Release

# Pushing a tag such as v0.1.0 builds installers on Linux, Windows and macOS plus updater
# files signed with the project's key (TAURI_SIGNING_PRIVATE_KEY), and attaches them with
# latest.json (the in-app update manifest) and SHA256SUMS to a DRAFT GitHub release. Nothing
# reaches users until a maintainer publishes the draft. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=$tag tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in tauri.conf.json, package.json and Cargo.toml"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Updater config is safe to ship
        run: |
          jq -e '.plugins.updater
                 | (.pubkey | length > 40)
                   and .requireSignedVersion == true
                   and (has("dangerousInsecureTransportProtocol") | not)
                   and (has("allowDowngrades") | not)' src-tauri/tauri.conf.json

  build:
    name: Build (${{ matrix.platform }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev build-essential file
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build bundles (installers unsigned, updates signed)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set. See docs/RELEASING.md."
            exit 1
          fi
          # Signed updater files, plus a numeric MSI version for pre-release tags.
          npx tauri build --config "$(node scripts/release-build-config.mjs "${{ needs.check.outputs.version }}")"
      - name: Collect installers
        shell: bash
        run: |
          v="${{ needs.check.outputs.version }}"
          b=target/release/bundle
          out=release-assets  # not dist/: that is the Vite build output
          mkdir "$out"
          shopt -s nullglob
          # take <signed|plain> <published name> <matches...>: exactly one match, copied
          # (with its updater signature when signed) under the published name.
          take() {
            local mode=$1 name=$2; shift 2
            if [ $# -ne 1 ]; then echo "::error::expected one file for $name, found $#: $*"; exit 1; fi
            cp "$1" "$out/$name"
            if [ "$mode" = signed ]; then cp "$1.sig" "$out/$name.sig"; fi
          }
          case "$RUNNER_OS" in
            Linux)
              take signed "table-pro-max_${v}_amd64.deb"          "$b"/deb/*.deb
              take signed "table-pro-max-${v}-1.x86_64.rpm"        "$b"/rpm/*.rpm
              take signed "table-pro-max_${v}_amd64.AppImage"      "$b"/appimage/*.AppImage ;;
            Windows)
              take signed "table-pro-max_${v}_x64_en-US.msi"       "$b"/msi/*.msi
              take signed "table-pro-max_${v}_x64-setup.exe"       "$b"/nsis/*-setup.exe ;;
            macOS)
              take plain  "table-pro-max_${v}_aarch64.dmg"         "$b"/dmg/*.dmg
              take signed "table-pro-max_${v}_aarch64.app.tar.gz"  "$b"/macos/*.app.tar.gz ;;
          esac
          ls -l "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error

  draft:
    name: Draft release
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Updater manifest
        run: |
          v="${{ needs.check.outputs.version }}"
          node scripts/updater-manifest.mjs --version "$v" --repo "$GITHUB_REPOSITORY" \
            --notes "docs/releases/v$v.md" --dir release-assets --out release-assets/latest.json
      - name: Checksums
        working-directory: release-assets
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" .
          cat SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.check.outputs.version }}"
          notes="docs/releases/v${v}.md"
          [ -f "$notes" ] || { echo "::error::Missing release notes $notes"; exit 1; }
          pre=""
          case "$v" in *-*) pre="--prerelease" ;; esac  # only suffixed tags; plain tags are offered as updates
          gh release create "$GITHUB_REF_NAME" release-assets/* --draft $pre --verify-tag \
            --title "Table Pro Max $v" --notes-file "$notes"
