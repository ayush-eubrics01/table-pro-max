name: Release

# Pushing a tag such as v0.1.0 builds unsigned installers on Linux, Windows and macOS and
# attaches them, with SHA256SUMS, to a DRAFT GitHub release. Nothing is published until a
# maintainer reviews the draft and publishes it. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=$tag tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in tauri.conf.json, package.json and Cargo.toml"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev build-essential file
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build bundles (unsigned)
        run: npx tauri build
      - name: Collect installers
        shell: bash
        run: |
          v="${{ needs.check.outputs.version }}"
          b=target/release/bundle
          out=release-assets  # not dist/: that is the Vite build output
          mkdir "$out"
          case "$RUNNER_OS" in
            Linux)
              cp "$b/deb/Table Pro Max_${v}_amd64.deb"           "$out/table-pro-max_${v}_amd64.deb"
              cp "$b/rpm/Table Pro Max-${v}-1.x86_64.rpm"         "$out/table-pro-max-${v}-1.x86_64.rpm"
              cp "$b/appimage/Table Pro Max_${v}_amd64.AppImage"  "$out/table-pro-max_${v}_amd64.AppImage" ;;
            Windows)
              cp "$b/msi/Table Pro Max_${v}_x64_en-US.msi"        "$out/table-pro-max_${v}_x64_en-US.msi"
              cp "$b/nsis/Table Pro Max_${v}_x64-setup.exe"       "$out/table-pro-max_${v}_x64-setup.exe" ;;
            macOS)
              cp "$b/dmg/Table Pro Max_${v}_aarch64.dmg"          "$out/table-pro-max_${v}_aarch64.dmg" ;;
          esac
          ls -l "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error

  draft:
    name: Draft release
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Checksums
        working-directory: release-assets
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" .
          cat SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.check.outputs.version }}"
          notes="docs/releases/v${v}.md"
          [ -f "$notes" ] || { echo "::error::Missing release notes $notes"; exit 1; }
          pre=""
          case "$v" in 0.*|*-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release-assets/* --draft $pre --verify-tag \
            --title "Table Pro Max $v" --notes-file "$notes"
