name: CI

# Every PR and every push to main runs this. "CI passed" is the one required check: it always
# reports, so docs-only PRs are not left waiting. Build jobs are skipped when only docs, Markdown
# or LICENSE files changed. The desktop app is compiled and linted (clippy) on Linux for PRs and
# on all three platforms on main. Installers are built only by release.yml, and on PRs labelled
# `full-ci` (all three platforms, attached to the run). Only main saves build caches; PRs reuse
# them. See CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# A newer push to the same PR cancels its run in progress. Runs on main are never cancelled,
# so every merged commit gets a full result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.plan.outputs.code }}
      platforms: ${{ steps.plan.outputs.platforms }}
      bundle: ${{ steps.plan.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          # Build unless every changed file is documentation. Unknown base (new branch, force
          # push): build.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            code=true
          elif [ -n "$(git diff --name-only "$(git merge-base "$BASE" "$HEAD")" "$HEAD" | { grep -vE '^docs/|\.md$|^LICENSE' || true; })" ]; then
            code=true
          else
            code=false
          fi
          if [ "$EVENT" = push ] || [ "$FULL_CI" = true ]; then
            platforms='["ubuntu-24.04","windows-latest","macos-latest"]'
          else
            platforms='["ubuntu-24.04"]'
          fi
          # Installers only when asked for with the full-ci label (release.yml builds them for tags).
          bundle=$FULL_CI
          {
            echo "code=$code"
            echo "platforms=$platforms"
            echo "bundle=$bundle"
          } >> "$GITHUB_OUTPUT"
          echo "Code changed: $code. Desktop checks: $platforms. Installers: $bundle"

  core:
    name: Rust core (unit + integration)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p tpm-core --all-targets -- -D warnings
      - name: Start disposable databases and SSH bastion
        run: scripts/test-db.sh up | tee "$RUNNER_TEMP/test-env.sh"
      - name: Unit and integration tests
        run: |
          source "$RUNNER_TEMP/test-env.sh"
          cargo test -p tpm-core
      - if: always()
        run: scripts/test-db.sh down

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  desktop:
    name: Desktop check (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.changes.outputs.platforms) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev build-essential file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compile and lint the desktop app
        run: cargo clippy -p table-pro-max -- -D warnings
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.bundle == 'true'
        with:
          node-version: 24
          cache: npm
      - if: needs.changes.outputs.bundle == 'true'
        run: npm ci
      - name: Build installers (unsigned, full-ci label only)
        if: needs.changes.outputs.bundle == 'true'
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.bundle == 'true'
        with:
          name: bundles-${{ matrix.platform }}
          path: target/release/bundle/
          if-no-files-found: warn

  audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit --omit=dev

  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, core, frontend, desktop, audit]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was skipped for a docs-only change
        env:
          PLAN: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "plan: $PLAN; jobs: $RESULTS"
          [ "$PLAN" = success ] || { echo "::error::the plan job did not succeed"; exit 1; }
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a CI job ended with: $r"; exit 1 ;; esac
          done
