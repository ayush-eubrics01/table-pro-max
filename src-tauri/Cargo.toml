[package]
name = "table-pro-max"
description = "A free, privacy-first, cross-platform database client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "table_pro_max_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tpm-core = { path = "../crates/tpm-core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = ["duckdb"]
duckdb = ["tpm-core/duckdb"]
